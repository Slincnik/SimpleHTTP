name: Bug report
description: Report reproducible incorrect behavior in SimpleHTTP
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please keep the reproduction as small as possible and remove credentials or other sensitive data.

  - type: input
    id: version
    attributes:
      label: Package version
      description: Which version of @slincnik/simplehttp are you using?
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      description: Include the browser name and version.
      placeholder: Chrome 130, Firefox 132, Safari 18
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide a repository, playground link, or minimal code sample that demonstrates the problem.
      placeholder: |
        const api = createClient({ baseURL: '/api' })
        await api.get('/example')
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened? Include the complete error when relevant.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add relevant request options, response details, screenshots, or other context. Do not include secrets.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I confirmed this occurs in a supported modern browser.
          required: true
        - label: My report does not contain credentials or sensitive data.
          required: true
